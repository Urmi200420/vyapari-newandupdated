spring.application.name=vyapari-backend
server.port=8080

# ---- MySQL: override with environment variables DB_USER / DB_PASSWORD ----
spring.datasource.url=jdbc:mysql://localhost:3306/vyapari?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:vyapari_app}
spring.datasource.password=${DB_PASSWORD:VyapariLocal@2026}

# Hibernate creates / updates the tables from the entity classes (fine while developing)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- login session cookie ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- who may call the API from the browser (the Vite dev server) ----
vyapari.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://terminal.local:5173

# ---- first admin, created automatically when there is no admin yet ----
# Set ADMIN_EMAIL / ADMIN_PASSWORD in your environment. Change this password after your first login.
vyapari.admin.email=${ADMIN_EMAIL:admin@vyapari.com}
vyapari.admin.password=${ADMIN_PASSWORD:Admin@12345}
vyapari.admin.name=Vyapari Admin

# demo courier (delivery@vyapari.com / Delivery@123). Set to false anywhere real people can reach the server.
vyapari.seed.demo-delivery=true
